[package]
name = "agentic-credential-proxy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tailnet-local HTTP proxy that injects API credentials from the macOS Keychain"

[dependencies]
axum = { version = "0.8", features = ["http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "fs", "io-util", "time"] }
# rustls only, and no gzip/brotli/deflate: leaving those off is what keeps reqwest
# from transparently decompressing responses, which a passthrough proxy must not do.
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
tower-http = { version = "0.6", features = ["catch-panic", "limit"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
http = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
security-framework = "3"
# Only for O_NOFOLLOW, which is what makes the file drop's symlink refusal
# atomic with the open instead of a check the name can change out from under.
libc = "0.2"

# Only so the tests can drive the router in-process, with no listener, no
# network, and above all no keychain access.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 2
